[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", ".venv", "__pycache__", ".git"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
strict_optional = true

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.coverage.run]
source = [
    "app_common",
    "app_clientes",
    "app_empleados",
    "app_autenticacion",
    "app_productos",
    "app_ventas",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/asgi.py",
    "*/wsgi.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true