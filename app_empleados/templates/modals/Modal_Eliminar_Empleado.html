<div class="modal fade" tabindex="-1" id="modal_eliminar_empleado" aria-labelledby="modalEliminarLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="{% url 'empleados:eliminar' %}" id="form_eliminar_empleado">
        {% csrf_token %}
        <input type="hidden" name="empleado_id" id="eliminar_empleado_id" value="">

        <div class="modal-header">
          <h4 class="modal-title" id="modalEliminarLabel">¿Seguro de Eliminar?</h4>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">
          <p class="mb-2">¿Está seguro de que desea eliminar al siguiente empleado?</p>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span class="text-muted">Nombre:</span>
              <strong id="modal_eliminar_nombre">-</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span class="text-muted">Usuario:</span>
              <strong id="modal_eliminar_usuario">-</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span class="text-muted">Identificación:</span>
              <strong id="modal_eliminar_identificacion">-</strong>
            </li>
          </ul>
          <div class="alert alert-warning d-flex align-items-center mb-0" role="alert">
            <div>
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <strong>Advertencia:</strong> Esta acción bloqueará el acceso del empleado al sistema desactivando su cuenta.
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-danger" id="btn_confirmar_eliminar">Eliminar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var modalEliminar = document.getElementById('modal_eliminar_empleado');
    if (modalEliminar) {
      modalEliminar.addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        if (button) {
          var empleadoId = button.getAttribute('data-empleado-id');
          var empleadoNombre = button.getAttribute('data-empleado-nombre');
          var empleadoUsuario = button.getAttribute('data-empleado-usuario');
          var empleadoIdentificacion = button.getAttribute('data-empleado-identificacion');

          var inputId = modalEliminar.querySelector('#eliminar_empleado_id');
          var spanNombre = modalEliminar.querySelector('#modal_eliminar_nombre');
          var spanUsuario = modalEliminar.querySelector('#modal_eliminar_usuario');
          var spanIdentificacion = modalEliminar.querySelector('#modal_eliminar_identificacion');

          if (inputId) {
            inputId.value = empleadoId || '';
          }
          if (spanNombre) {
            spanNombre.textContent = empleadoNombre || 'este empleado';
          }
          if (spanUsuario) {
            spanUsuario.textContent = empleadoUsuario || '-';
          }
          if (spanIdentificacion) {
            spanIdentificacion.textContent = empleadoIdentificacion || '-';
          }
        }
      });
    }
  });
</script>
