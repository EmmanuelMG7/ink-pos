<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkPOS - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-body">
    <div class="d-flex justify-content-center align-items-center min-vh-100">
      <div class="bg-primary-subtle p-3 rounded">
        <div class="d-flex w-100 align-items-center m-2">
          <i class="bi bi-droplet-half" style="font-size: 2rem;"></i>
          <h1 class="mb-0 ms-2 text-center w-100">InkPOS</h1>
        </div>
        <form action="" method="post">
          <input type="text" class="form-control mb-2" placeholder="Usuario" />
          <input
            type="text"
            class="form-control mb-2"
            placeholder="Contraseña"
          />
          <button type="submit" class="btn btn-primary w-100">
            Iniciar Sesion
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
