{% extends "Master.html" %}

{% block title %}
    InkPOS - Ventas
{% endblock %}

{% block content %}
<div class="row m-2">
    <div class="col-md-2">
        <input type="text" class="form-control" placeholder="ID Cliente" autofocus>
    </div>
    <div class="col-md-4">
        <input type="text" class="form-control" placeholder="Nombre Cliente" disabled readonly>
    </div>
    <div class="col-md-6">
        <input type="text" class="form-control" placeholder="Codigo o Nombre del Producto" disabled>
    </div>
</div>
<div class="row m-2 h-100">
    <div class="col-md-6 table-responsive" style="max-height: 50vh; overflow-y: auto;">
        <table class="table table-striped table-hover table-sm caption-top">
            <caption>Productos en Venta</caption>
            <thead class="sticky-top">
                <th scope="col">Codigo</th>
                <th scope="col" class="w-50">Nombre</th>
                <th scope="col">Precio</th>
                <th scope="col">Stock</th>
            </thead>
        </table>
    </div>
    <div class="col-md-6 table-responsive" style="max-height: 50vh; overflow-y: auto;">
        <table class="table table-striped table-hover table-sm caption-top">
            <caption>Resumen de Venta</caption>
            <thead class="sticky-top">
                <th scope="col">Codigo</th>
                <th scope="col" class="w-50">Nombre</th>
                <th scope="col">Cantidad</th>
                <th scope="col">Subtotal</th>
            </thead>
        </table>
    </div>
</div>
{% endblock %}
